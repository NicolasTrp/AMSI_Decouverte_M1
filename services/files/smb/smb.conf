[global]
   workgroup = LICORNIA
   server string = Licornia Fileshare
   security = user
   map to guest = Bad User
   guest account = nobody
   server min protocol = SMB2
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 0
   smb ports = 445

# Partage public — accessible en ANONYME (recon SMB).
[public]
   comment = Documents publics Licornia
   path = /srv/public
   browseable = yes
   read only = yes
   guest ok = yes

# Partage RH — réservé au compte a.pommier (accès après crack du hash MD5).
[rh]
   comment = Ressources Humaines (restreint)
   path = /srv/rh
   browseable = yes
   read only = yes
   guest ok = no
   valid users = a.pommier
