[global]
   workgroup = SHOPXPRESS
   server string = ShopXpress Fileshare
   security = user
   map to guest = Bad User
   guest account = nobody
   server min protocol = SMB2
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 0
   smb ports = 445

# Partage public — accessible en ANONYME (recon SMB).
[public]
   comment = Documents publics ShopXpress
   path = /srv/public
   browseable = yes
   read only = yes
   guest ok = yes

# Partage STOCK — réservé au compte s.morel (accès après crack du hash MD5).
[stock]
   comment = Gestion des stocks (restreint)
   path = /srv/stock
   browseable = yes
   read only = yes
   guest ok = no
   valid users = s.morel
